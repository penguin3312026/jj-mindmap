<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中级经济师（人力）备考思维导图 · 可编辑 · 持续更新</title>
<style>
  :root{
    --bg:#eef1f8; --paper:#ffffff; --line:#cdd6e8;
    --ink:#1f2733; --sub:#5b6678; --dim:#9aa6bb;
    --lv0:#7c6cf0; --lv1:#3b82f6; --lv2:#10b981; --lv3:#f59e0b; --lv4:#8b5cf6; --lv5:#ef4444;
    --gold:#f5b301; --fact:#1f9d6b; --tip:#8b5cf6; --warn:#e8821a; --must:#ef4b5e; --key:#2f80ed;
    --shadow:0 4px 16px rgba(35,52,90,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}

  /* ---------- 顶栏 banner ---------- */
  .banner{position:sticky;top:0;z-index:60;
    background:linear-gradient(120deg,#6d5dd3 0%,#5b8def 55%,#3aa0c9 100%);
    color:#fff;padding:14px 18px 12px;box-shadow:0 6px 20px rgba(80,90,160,.22);}
  .banner h1{font-size:1.12rem;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .banner h1 .badge{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);
    font-size:.68rem;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:0;}
  .ver{font-size:.68rem;padding:2px 9px;border-radius:20px;font-weight:700;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);}
  .ver.ok{background:rgba(31,157,107,.9);border-color:rgba(255,255,255,.5);}
  .ver.bad{background:rgba(239,75,94,.92);border-color:rgba(255,255,255,.5);}
  .toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
  .btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;
    padding:6px 13px;border-radius:9px;font-size:.8rem;cursor:pointer;transition:.16s;white-space:nowrap;font-weight:600;}
  .btn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px);}
  .btn.primary{background:#fff;color:#5b4fd6;border-color:#fff;}
  .btn.primary:hover{background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .btn.publish{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:#16a34a;color:#fff;font-weight:700;}
  .btn.publish:hover{background:linear-gradient(135deg,#15803d,#16a34a);transform:translateY(-1px);box-shadow:0 6px 18px rgba(34,197,94,.4);}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.85);}
  .hint{font-size:.74rem;color:rgba(255,255,255,.82);margin-top:9px;}

  /* ---------- 画布 ---------- */
  .canvas{max-width:1040px;margin:18px auto 60px;padding:0 14px;}
  .tree{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:18px 14px 22px;}

  /* ---------- 节点 ---------- */
  .node{position:relative;margin:5px 0;}
  .node-head{position:relative;display:flex;align-items:center;gap:9px;
    background:var(--paper);border:1px solid #e7ebf4;border-left:4px solid var(--c,#aaa);
    border-radius:12px;padding:9px 12px;box-shadow:0 1px 3px rgba(35,52,90,.05);transition:.16s;}
  .node-head:hover{box-shadow:var(--shadow);transform:translateX(2px);border-color:#d6deee;}
  .node.lv0 > .node-head{background:linear-gradient(120deg,#f3f0ff,#eef4ff);
    border-left:4px solid var(--lv0);font-size:1.02rem;}
  .node.lv1 > .node-head{border-left-color:var(--lv1);}
  .node.lv2 > .node-head{border-left-color:var(--lv2);}
  .node.lv3 > .node-head{border-left-color:var(--lv3);}
  .node.lv4 > .node-head{border-left-color:var(--lv4);}
  .node.lv5 > .node-head{border-left-color:var(--lv5);}

  .caret{width:22px;height:22px;border-radius:50%;flex-srink:0;display:flex;align-items:center;justify-content:center;
    font-size:.62rem;color:var(--sub);background:#f1f4fb;border:1px solid #e2e8f4;cursor:pointer;transition:.2s;}
  .node.collapsed > .node-head .caret{transform:rotate(-90deg);}

  .icon{width:27px;height:27px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:.8rem;font-weight:800;color:#fff;background:var(--c,#aaa);}
  .node.lv0 .icon{background:linear-gradient(135deg,var(--lv0),#9b8cf5);}
  .node.lv1 .icon{background:linear-gradient(135deg,var(--lv1),#60a5fa);}
  .node.lv2 .icon{background:linear-gradient(135deg,var(--lv2),#34d399);}
  .node.lv3 .icon{background:linear-gradient(135deg,var(--lv3),#fbbf24);}
  .node.lv4 .icon{background:linear-gradient(135deg,var(--lv4),#a78bfa);}
  .node.lv5 .icon{background:linear-gradient(135deg,var(--lv5),#f87171);}

  .title{flex:1;min-width:0;font-weight:700;font-size:.9rem;outline:none;border-radius:6px;padding:2px 5px;cursor:text;word-break:break-word;}
  .title:focus{background:#eef4ff;box-shadow:0 0 0 2px #5b8def;}

  .stars{font-size:.86rem;cursor:pointer;user-select:none;flex-shrink:0;letter-spacing:1px;line-height:1;}
  .stars .s{color:var(--dim);transition:.12s;}
  .stars .s.on{color:var(--gold);text-shadow:0 0 6px rgba(245,179,1,.5);}

  .acts{display:flex;gap:4px;flex-shrink:0;}
  .mini{width:27px;height:27px;border-radius:7px;border:1px solid #e2e8f4;background:#f6f8fd;color:var(--sub);
    cursor:pointer;font-size:.82rem;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .mini:hover{background:#eef4ff;border-color:#5b8def;color:#3a6fd6;}
  .mini.drag{cursor:grab;font-weight:700;color:#8a93a8;background:#eef1fb;}
  .mini.drag:active{cursor:grabbing;}
  .node.dragging{opacity:.45;}
  .node-head.drop-before{box-shadow:inset 0 3px 0 var(--key);}
  .node-head.drop-after{box-shadow:inset 0 -3px 0 var(--key);}
  .node-head.drop-child{box-shadow:inset 3px 0 0 var(--key);}
  .mini.del:hover{background:#fff0f1;border-color:var(--must);color:var(--must);}
  /* 调色盘 */
  .palette{position:fixed;z-index:200;display:flex;gap:6px;background:#fff;padding:8px 9px;border-radius:12px;
    box-shadow:0 8px 28px rgba(35,52,90,.22);border:1px solid #e2e8f4;}
  .swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #e2e8f4;
    display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#888;transition:.12s;}
  .swatch:hover{transform:scale(1.18);}

  /* ---------- 缩进树连线 ---------- */
  .node-body{position:relative;padding-left:24px;margin-left:13px;}
  .lv0 > .node-body{padding-left:6px;margin-left:0;}
  .node-body::before{content:'';position:absolute;left:0;top:-4px;bottom:18px;width:2px;background:var(--line);border-radius:2px;}
  .lv0 > .node-body::before{display:none;}
  .node:not(.lv0) > .node-head::before{content:'';position:absolute;left:-24px;top:21px;width:24px;height:2px;background:var(--line);border-radius:2px;}
  .node.collapsed > .node-body{display:none;}

  /* ---------- 说明块（富文本） ---------- */
  .note-wrap{margin:6px 0 2px;}
  .ntbar{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
  .ntbtn{width:26px;height:26px;border-radius:7px;border:1px solid #e2e8f4;background:#f6f8fd;color:var(--sub);
    cursor:pointer;font-size:.82rem;display:flex;align-items:center;justify-content:center;transition:.15s;font-weight:800;font-family:inherit;}
  .ntbtn:hover{background:#eef4ff;border-color:#5b8def;color:#3a6fd6;}
  .ntbtn.c{font-size:1rem;}
  .note{width:100%;background:#fafbfe;border:1px solid #e7ebf4;border-left:4px solid var(--lv2);
    border-radius:9px;color:var(--ink);font-size:.85rem;padding:8px 11px;min-height:36px;outline:none;
    font-family:inherit;line-height:1.65;transition:.15s;word-break:break-word;}
  .note:empty:before{content:'点此输入说明 / 考点 / 口诀，选中文字可加粗·斜体·下划线·着色…';color:var(--dim);font-size:.8rem;}
  .note:focus{box-shadow:0 0 0 2px #5b8def;border-color:#5b8def;}
  .addnote{font-size:.76rem;color:var(--dim);cursor:pointer;margin:5px 0 2px;display:inline-block;font-weight:600;}
  .addnote:hover{color:#3a6fd6;}

  /* ---------- 预览模式：隐藏所有编辑控件，只留干净导图 ---------- */
  body.preview .acts,
  body.preview .addnote,
  body.preview .ntbar{display:none !important;}
  body.preview .title{cursor:default;user-select:none;}
  body.preview .stars{pointer-events:none;}
  body.preview .note{cursor:default;user-select:text;}
  body.preview .note:empty,
  body.preview .note-wrap:has(.note:empty){display:none !important;}

  /* ---------- 阅读模式：手机友好的竖向卡片流 ---------- */
  body.reading .banner .toolbar,
  body.reading .banner .hint{display:none;}
  body.reading .banner{padding:12px 16px;box-shadow:0 4px 14px rgba(80,90,160,.18);}
  body.reading .canvas{margin:0;padding:8px 12px 90px;max-width:none;}
  body.reading .tree{box-shadow:none;background:transparent;border-radius:0;padding:0;}
  body.reading .node{margin:10px 0;}
  body.reading .node-head{box-shadow:0 1px 4px rgba(35,52,90,.06);border:1px solid #eef1f7;
    background:#fff;border-radius:14px;padding:13px 14px;}
  body.reading .node.lv0 > .node-head{background:linear-gradient(120deg,#f3f0ff,#eef4ff);font-size:1.08rem;}
  body.reading .title{font-size:1rem;font-weight:800;cursor:default;user-select:none;}
  body.reading .icon{width:30px;height:30px;font-size:.9rem;}
  body.reading .caret{width:26px;height:26px;}
  body.reading .stars{font-size:1rem;pointer-events:none;}
  body.reading .acts,
  body.reading .addnote,
  body.reading .ntbar{display:none !important;}
  body.reading .note{background:#fafbff;border-left:4px solid var(--lv2);font-size:.95rem;line-height:1.85;
    padding:11px 14px;border-radius:11px;}
  body.reading .note:empty,
  body.reading .note-wrap:has(.note:empty){display:none !important;}
  .fab{position:fixed;right:16px;bottom:18px;z-index:90;display:none;background:#5b4fd6;color:#fff;border:none;
    border-radius:30px;padding:13px 20px;font-size:.92rem;font-weight:700;
    box-shadow:0 6px 20px rgba(91,79,214,.4);cursor:pointer;}
  body.reading .fab{display:block;}

  /* ========== 翻卡片模式（精美版） ========== */
  .cardview{position:fixed;inset:0;z-index:300;
    background:linear-gradient(160deg,#0f0c29 0%,#302b63 40%,#24243e 70%,#1a1a2e 100%);
    display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;
    overflow-y:auto;}
  .cardview.on{display:flex;}
  .closecv{position:fixed;top:14px;right:18px;color:rgba(255,255,255,.7);font-size:1.8rem;cursor:pointer;z-index:310;
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);
    transition:.2s;}
  .closecv:hover{background:rgba(255,255,255,.18);color:#fff;}

  /* 卡片舞台 */
  .cardstage{width:min(94vw,460px);min-height:min(60vh,560px);position:relative;margin-top:8px;}
  .card{width:100%;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 25px 70px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.25);position:relative;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);}

  /* ---- 头部（考点名 + 星级 + 章节，渐变）---- */
  .chead{
    background:var(--card-grad, linear-gradient(145deg,#667eea 0%,#764ba2 50%,#f093fb 100%));
    color:#fff;padding:26px 26px 22px;position:relative;overflow:hidden;text-align:center;}
  /* 纹理叠加 */
  .chead::before{content:'';position:absolute;inset:0;
    background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.065;mix-blend-mode:overlay;pointer-events:none;}
  /* 装饰圆 */
  .chead::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;
    background:rgba(255,255,255,.07);top:-80px;right:-60px;pointer-events:none;}
  .chead > *{position:relative;z-index:1;}
  /* 章节标签 */
  .ctag{display:inline-block;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
    font-size:.7rem;font-weight:700;padding:3px 12px;border-radius:20px;letter-spacing:.5px;
    margin-bottom:14px;backdrop-filter:blur(4px);}
  /* 标题区 */
  .cf-title{font-size:1.5rem;font-weight:900;line-height:1.4;text-shadow:0 2px 12px rgba(0,0,0,.2);
    max-width:100%;word-break:break-word;margin-bottom:12px;}
  /* 星级 */
  .cf-stars{font-size:1.15rem;letter-spacing:4px;text-shadow:0 0 10px rgba(245,179,1,.5);}
  .cf-stars .gs{color:rgba(255,255,255,.3);}
  .cf-stars .gs.on{color:#fde68a;}

  /* ---- 内容区（直接显示完整 detail，保留彩色）---- */
  .cbody-wrap{
    background:var(--card-back-bg, #fff);
    color:var(--card-ink, #1f2733);position:relative;
    padding:22px 24px 26px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  /* 内容区纹理 */
  .cbody-wrap::before{content:'';position:absolute;inset:0;
    background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n2)'/%3E%3C/svg%3E");
    opacity:.045;mix-blend-mode:multiply;pointer-events:none;z-index:0;}
  .cbody-wrap > *{position:relative;z-index:1;}
  .cb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
    padding-bottom:12px;border-bottom:2px solid #f0eff5;flex-shrink:0;}
  .cb-path{font-size:.72rem;color:#8b5cf6;font-weight:800;letter-spacing:.3px;max-width:70%;}
  .cb-chip{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px;
    background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
  /* ===== 富文本：完整保留用户标注的颜色/加粗/斜体/下划线 ===== */
  .cb-body{font-size:.95rem;line-height:1.95;word-break:break-word;color:#2d3748;flex:1;
    padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.75);
    box-shadow:inset 0 1px 4px rgba(35,52,90,.04);backdrop-filter:blur(2px);}
  /* 加粗 */
  .cb-body b, .cb-body strong{font-weight:800;color:inherit;}
  /* 斜体 */
  .cb-body i, .cb-body em{font-style:italic;}
  /* 下划线 */
  .cb-body u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px;}
  /* 彩色字体 —— 覆盖所有可能写法 */
  .cb-body font[color]{color:attr(color) !important;}
  .cb-body font[color="#ef4b5e"], .cb-body font[color=#ef4b5e],
  .cb-body [style*="color:#ef4b5e"], .cb-body [style*="color: rgb(239, 75, 94)"]{color:#ef4b5e !important;font-weight:700;}  /* 红-强调 */
  .cb-body font[color="#8b5cf6"], .cb-body font[color=#8b5cf6],
  .cb-body [style*="color:#8b5cf6"], .cb-body [style*="color: rgb(139, 92, 246)"]{color:#7c3aed !important;font-weight:700;}  /* 紫-概念 */
  .cb-body font[color="#1f9d6b"], .cb-body font[color=#1f9d6b],
  .cb-body [style*="color:#1f9d6b"], .cb-body [style*="color: rgb(31, 157, 107)"]{color:#059669 !important;font-weight:600;}  /* 绿-重点 */
  .cb-body font[color="#2f80ed"], .cb-body font[color=#2f80ed],
  .cb-body [style*="color:#2f80ed"], .cb-body [style*="color: rgb(47, 128, 237)"]{color:#1d4ed8 !important;font-weight:700;}  /* 蓝-关键 */
  .cb-body font[color="#e8821a"], .cb-body font[color=#e8821a],
  .cb-body [style*="color:#e8821a"], .cb-body [style*="color: rgb(232, 130, 26)"]{color:#c2410c !important;font-weight:700;}  /* 橙-提示 */
  .cb-body font[color="#f5b301"], .cb-body font[color=#f5b301],
  .cb-body [style*="color:#f5b301"], .cb-body [style*="color: rgb(245, 179, 1)"]{color:#b45309 !important;font-weight:700;}  /* 金-注意 */
  /* 深色背景卡片的内容区：自动用浅色文字 */
  .cbody-wrap.dark-theme .cb-body{color:#e8ecf4;background:rgba(30,35,55,.65);}
  .cbody-wrap.dark-theme .cb-header{border-color:rgba(255,255,255,.12);}
  .cbody-wrap.dark-theme .cb-path{color:#a78bfa;}
  .cbody-wrap.dark-theme b, .cbody-wrap.dark-theme strong{color:#fff;}
  .cb-body div{margin:7px 0;}
  .cb-body br{display:block;content:'';margin:5px 0;}

  /* 导航栏 */
  .cardnav{display:flex;gap:10px;margin-top:20px;align-items:center;flex-shrink:0;}
  .cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;
    padding:12px 20px;border-radius:14px;font-size:.9rem;cursor:pointer;font-weight:700;transition:.2s;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .cbtn:hover{background:rgba(255,255,255,.24);transform:translateY(-1px);}
  .cbtn:active{transform:scale(.96);}
  .cbtn-next{background:linear-gradient(135deg,#667eea,#764ba2);border-color:transparent;
    box-shadow:0 6px 20px rgba(102,126,234,.4);}
  .cbtn-next:hover{box-shadow:0 8px 28px rgba(102,126,234,.55);}

  /* 进度条 */
  .cprog-wrap{width:min(94vw,440px);margin-top:14px;display:flex;align-items:center;gap:12px;}
  .cprog-bar{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;}
  .cprog-fill{height:100%;background:linear-gradient(90deg,#667eea,#f093fb);border-radius:3px;
    transition:width .4s ease;}
  .cprog-text{color:rgba(255,255,255,.7);font-size:.8rem;font-weight:600;white-space:nowrap;min-width:72px;
    text-align:right;}

  .cardview .hint{color:rgba(255,255,255,.55);max-width:440px;text-align:center;margin-top:10px;
    font-size:.76rem;line-height:1.5;}

  /* 手机适配 */
  @media(max-width:560px){
    .cardstage{width:94vw;min-height:56vh;}
    .chead{padding:22px 18px 18px;}
    .cf-title{font-size:1.32rem;}
    .cbody-wrap{padding:18px 16px 22px;}
    .cb-body{font-size:.9rem;}
    .cbtn{padding:10px 16px;font-size:.85rem;}
  }

  @media print{
    body{background:#fff;} .banner{display:none;} .canvas{margin:0;padding:0;}
    .tree{box-shadow:none;padding:0;} .node-head{break-inside:avoid;box-shadow:none;}
    .note{background:#fff!important;} .mini,.acts{display:none;}
  }
  @media(max-width:560px){
    .banner h1{font-size:1rem;} .title{font-size:.85rem;}
    /* 手机端：所有模块纯左对齐，去掉缩进空白与竖线；层级靠图标色/标题字号+字重区分 */
    .node-body, .lv0 > .node-body{padding-left:0 !important;margin-left:0 !important;}
    .node-body::before, .node:not(.lv0) > .node-head::before{display:none !important;}
    /* 强化层级：标题字号随层级递减，左对齐也能一眼分清 */
    .node.lv0 > .node-head .title{font-size:1.06rem;font-weight:800;}
    .node.lv1 > .node-head .title{font-size:.96rem;font-weight:800;}
    .node.lv2 > .node-head .title{font-size:.9rem;font-weight:700;}
    .node.lv3 > .node-head .title,
    .node.lv4 > .node-head .title,
    .node.lv5 > .node-head .title{font-size:.86rem;font-weight:600;color:#485066;}
  }
  /* 同步按钮：发现新版本时闪烁提醒 */
  .btn.blink{animation:syncblink 1s steps(2,end) infinite;}
  @keyframes syncblink{0%{background:#5b4fd6;}50%{background:#ef4b5e;}100%{background:#5b4fd6;}}
  .sync-badge{margin-left:6px;background:#ef4b5e;color:#fff;font-size:.66rem;font-weight:800;border-radius:10px;padding:1px 7px;vertical-align:middle;}
</style>
</head>

<div class="banner">

         "detail": "<b>口诀「产结战术」：</b><br>① <font color=\"#2f80ed\">产</font>=产品和服务变化；② <font color=\"#2f80ed\">结</font>=组织结构调整/流程再造；③ <font color=\"#2f80ed\">战</font>=组织战略定位与调整（内部成长/收缩）；④ <font color=\"#2f80ed\">术</font>=技术变革（AI 替代等）。<br><font color=\"#ef4b5e\">考试灵活，常结合现实热点（数字化、AI）。</font>",

         "id": "n136",
         "text": "方法（5个：2主观+3定量）",

           "id": "n137",
           "text": "① 经验判断法（定性·主观）",
           "stars": 0,
           "detail": "<font color=\"#1f9d6b\">最简单。</font>靠中高层管理者凭经验与直觉判断。<br><b>适用：</b><font color=\"#ef4b5e\">时间短、规模小、环境稳定、人员流动不高（口诀「短小稳定」）。</font>要求管理者经验丰富。",
           "children": []
          },
          {
           "id": "n138",
           "text": "② 德尔菲法 / 专家预测（定性·主观）",
           "stars": 0,
           "detail": "<font color=\"#ef4b5e\">背对背、不见面、不开会、匿名、多轮进行</font>（不是集体讨论）。<br>专家数量<font color=\"#ef4b5e\">至少 20~30 人</font>且有代表性；主持人准备问题与资料。<br>优点：避免从众、省去开会麻烦、多轮更准确。美国兰德公司首创。",
           "children": []
          },
          {
           "id": "n139",
           "text": "③ 比率分析法（定量）",
           "stars": 0,
           "detail": "基于关键经营指标与需求量之间的<font color=\"#2f80ed\">固定比率</font>（如师生比）。<br><font color=\"#ef4b5e\">假定：人均生产率保持不变。</font>（口诀「率率相对」）",
           "children": []
          },
          {
           "id": "n140",
           "text": "④ 趋势预测法（定量）",
           "stars": 0,
           "detail": "简单的<font color=\"#2f80ed\">时间序列</font>分析（用过去几年数据预测未来）。<br>适用性强但较粗放、准确性有折扣。<br><font color=\"#ef4b5e\">假定：组织的技术等因素不会发生重大变化。</font>",
           "children": []
          },
          {
           "id": "n141",
           "text": "⑤ 回归分析法（定量）",
           "stars": 0,
           "detail": "研究<font color=\"#2f80ed\">人力资源需求数量</font>与<font color=\"#2f80ed\">影响因素</font>之间的函数关系（Y = AX + B）。<br>按自变量数量分：<font color=\"#ef4b5e\">一元回归 / 多元回归（多元更准）</font>；按形式分：线性/非线性（实践中常用线性）。<br><font color=\"#8b5cf6\">注意：分类依据是「自变量数量」，不是线性/非线性。</font>",
           "children": []
          }
         ]
        }
       ]

    {
     "id": "n148",
     "text": "第二节 人力资源供求平衡的基本对策与方法",
     "stars": 3,
     "detail": "",
     "children": [
      {
       "id": "n149",
       "text": "一、基本对策（三种情形）",
       "stars": 1,
       "detail": "",
       "children": [
        {
         "id": "n150",
         "text": "情形1：需求大于供给（人太少）",
         "stars": 0,
         "detail": "<font color=\"#ef4b5e\">口诀「人时效率有外包」：</font>① 先关门（降低员工流失率，留住人）；② 时 = 加班延长工时（短期/阶段用）；③ 招人（劳动合同/返聘退休人员/小时工，灵活招）；④ 技术 = 改进生产技术、优化流程、培训提效；⑤ 外包 = 非核心业务外包。",
         "children": []
        },
        {
         "id": "n151",
         "text": "情形2：需求小于供给（人太多）",
         "stars": 0,
         "detail": "<font color=\"#ef4b5e\">口诀「人时培训」：</font>① 人 = 关门（冻结雇用、自然减员、鼓励提前退休、临时/永久裁员）；② 时 = 缩短工时（职位分享/工作分享，避免解雇）；③ 培训 = 对冗余人员培训、开展新业务。",
         "children": []
        },
        {
         "id": "n152",
         "text": "情形3：结构不匹配（数量OK，技能不符）",
         "stars": 0,
         "detail": "<font color=\"#ef4b5e\">口诀「培训配置」：该走的走，该换的换。</font>① 优先培训开发（适应未来工作）；② 学不会/无希望的离开（自然退休、终止合同）；③ 外部招更合适的新员工；④ 扩张期把不合适的人替换到辅助岗位，核心岗位留给新招的有能力者。",
         "children": []
        }
       ]
      },
      {
       "id": "n153",
       "text": "二、人力资源供求平衡的方法（两个汇总表）",
       "stars": 1,
       "detail": "<b>重点把握两个汇总表，具体方法偶尔考。</b>",
       "children": [
        {
         "id": "n154",
         "text": "汇总表1：减少未来人员过剩（9种，分3类）",
         "stars": 0,
         "detail": "按「速度 + 员工受伤害程度」分类：<br>① <font color=\"#ef4b5e\">快+伤害高</font>：裁员、降薪、降职；<br>② <font color=\"#ef4b5e\">快+伤害中</font>：职位调动、工作分享；<br>③ <font color=\"#1f9d6b\">慢+伤害低</font>：冻结雇用、自然减员、鼓励提前退休、重新培训。",
         "children": []
        },
        {
         "id": "n155",
         "text": "汇总表2：避免未来人员短缺（7种，分4类）",
         "stars": 0,
         "detail": "按「速度 + 可撤回程度」分类：<br>① <font color=\"#ef4b5e\">快+高</font>：加班加点、雇用临时工、外包；<br>② <font color=\"#8b5cf6\">慢+高</font>（高配）：再培训后换岗；<br>③ <font color=\"#ef4b5e\">慢+中</font>（中流底住）：降低流动率；<br>④ <font color=\"#1f9d6b\">慢+低</font>（低新）：雇用新员工、技术创新。",
         "children": []
        },
        {
         "id": "n156",
         "text": "具体方法（了解）",
         "stars": 0,
         "detail": "",
         "children": [
          {
           "id": "n157",
           "text": "裁员",
           "stars": 0,
           "detail": "企业强化竞争力、有计划、大量裁减。人员过剩的<font color=\"#ef4b5e\">典型反应</font>。<br>对员工伤害大（短期痛苦+长期心理创伤）；对企业也有负面影响：人才流失、破坏团队社会网络、剩余员工心存芥蒂/忠诚度降、企业形象受损。<br><font color=\"#1f9d6b\">应采用「手术式裁员」而非一刀切；提供合理解释、保证公平、人性化。</font>",
           "children": []
          },
          {
           "id": "n158",
           "text": "提前退休计划",
           "stars": 0,
           "detail": "针对老员工（经验丰富、稳定性高，但成本高、阻碍新员工晋升）。<br><font color=\"#ef4b5e\">成功与否很大程度上取决于预测的准确性。</font>",
           "children": []
          },
          {
           "id": "n159",
           "text": "雇用临时工 / 劳务派遣",
           "stars": 0,
           "detail": "<font color=\"#1f9d6b\">优点：</font>灵活、管理/财务负担低、小公司适用、培训成本低、局外人客观视角、多组织经验。<br><font color=\"#ef4b5e\">不利：</font>组织承诺与忠诚度低、与正式员工关系紧张合作低。<br>处理关键：裁员与雇临时工之间留较长缓冲时间；安抚正式员工（工作内容区分、让其感到被重视）；不形成低人一等印象。",
           "children": []
          },
          {
           "id": "n160",
           "text": "业务外包与离岸经营",
           "stars": 0,
           "detail": "<font color=\"#1f9d6b\">外包好处：</font>控制直接雇用数量、提升 HR 管理价值、把 HR 从日常事务解放出来做战略。<br><font color=\"#ef4b5e\">离岸经营 = 跨国外包</font>（岗位从一国转移到另一国）；最初是简单窄岗位（生产、呼叫中心），现已延伸到高技能（证券分析、技术研发）。<br>成功关键：选靠谱外包商（规模大、历史久）、不涉及专利/安全保障、模块化独立工作、从小开始密切监督。",
           "children": []
          },
          {
           "id": "n161",
           "text": "调整薪酬和工作时长",
           "stars": 0,
           "detail": "短缺 → 安排加班，给加班费（增加工时费用）；<br>过剩 → 缩短工时降薪（工作分享/职位分享，保持单位时间薪酬不变减少时间），或<font color=\"#8b5cf6\">非带薪休假</font>（降成本、避免解雇，但只解决短期问题、本身有争议）。",
           "children": []
          }
         ]
        }
       ]
      }
     ]

  if(!res.ok){
    let msg = 'HTTP ' + res.status;
    try{ const j = await res.json(); if(j && j.message) msg = j.message; }catch(_){}
    throw new Error(msg);
  }
  return res;
}
function onLive(){
  const live = window.MAP_DATA;
  if(!live || !live.text){ showStatus('加载失败，显示内置快照', false); return; }
  LIVE_REV = live.rev || LIVE_REV;
  const local = readLocal();
  const localRev = local ? (local.rev||0) : 0;
  const embeddedRev = (EMBEDDED && EMBEDDED.rev) || 0;
  const baseRev = Math.max(localRev, embeddedRev);
  if(baseRev >= (live.rev||0)){
    // 优先本地未发布改动；其次用内置草稿（EMBEDDED），便于发布前在网页内预览草稿
    data = (local && localRev >= embeddedRev) ? local : deepCopy(EMBEDDED);
    data.rev = baseRev;
    showStatus('本机版 v'+baseRev+'（含未发布改动）', true);
  } else {
    // 服务器版本更新：以服务器为准，不再把本地（可能为旧/损坏）数据合并回来，避免重复节点复活
    data = deepCopy(live); reindex();
    data.rev = LIVE_REV;
    showStatus('已同步最新发布版 v'+LIVE_REV, true);
  }
  data.rev = LIVE_REV;
  saveLocal();
  render();
  clearSyncFlag();   // 同步成功，取消闪烁提醒
}

/* ---------- 导出（含富文本颜色/加粗，完整保留） ---------- */
function htmlToText(html){
  const d = document.createElement('div'); d.innerHTML = html || '';
  return (d.textContent || '').trim();
}
function exportMD(){
  let out='# 中级经济师（人力）备考思维导图\n\n';
  function walk(node, depth){
    const pad='  '.repeat(depth);
    let stars = node.stars>0 ? ' ' + '★'.repeat(node.stars) : '';
    out += pad + '- ' + node.text + stars + '\n';
    if(node.detail) out += pad + '  - 说明：' + htmlToText(node.detail) + '\n';
    node.children.forEach(c=>walk(c, depth+1));
  }
  data.children.forEach(c=>walk(c,0));
  download('备考思维导图.md', out, 'text/markdown');
}
function exportJSON(){
  download('备考思维导图.json', JSON.stringify(data,null,2), 'application/json');
}
function download(name, content, type){
  const blob=new Blob([content],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d&&d.text){
        if(d.isBook){ data=d; } else { const root=makeRoot(); root.children.push(d); data=root; }
        reindex(); saveLocal(); render(); showStatus('已导入本地文件', true);
      }
    }catch(err){ alert('JSON 解析失败'); }
  };
  r.readAsText(f); e.target.value='';
}

/* ---------- 翻卡片模式（精美版） ---------- */
let cards=[], ci=0;
function collectCards(node, path){
  /* 只收集有实质说明内容的叶子/节点，跳过空说明和纯容器节点 */
  const txt = (node.detail||'').replace(/<[^>]*>/g,'').trim();
  if(txt && txt.length > 2){
    cards.push({ title:node.text, stars:node.stars||0, detail:node.detail||'', path:path });
  }
  const np = path ? path+' › '+node.text : node.text;
  (node.children||[]).forEach(ch=>collectCards(ch, np));
}
function toggleCards(){
  const cv=document.getElementById('cardView');
  if(cv.classList.contains('on')){ cv.classList.remove('on'); return; }
  cards=[]; collectCards(data,'');
  if(!cards.length){ alert('还没有可做成卡片的考点说明，先去节点里添加说明吧'); return; }
  ci=0; renderCard(); cv.classList.add('on');
}

/* 根据星级选正面渐变色 + 反面配对背景 */
const CARD_THEMES = [
  { grad:'linear-gradient(145deg,#667eea 0%,#764ba2 50%,#f093fb 100%)', backBg:'#f8f6ff', ink:'#1f2733', dark:false },   // 0星 紫粉→淡紫底
  { grad:'linear-gradient(145deg,#43cea2 0%,#185a9d 100%)',           backBg:'#f0faf7', ink:'#1a3a34', dark:false },   // 1星 蓝绿→薄荷底
  { grad:'linear-gradient(145deg,#f093fb 0%,#f5576c 50%,#f093fb 100%)', backBg:'#fff5f7', ink:'#3d1525', dark:false }, // 2星 粉红→浅玫底
  { grad:'linear-gradient(145deg,#ff6b6b 0%,#feca57 30%,#f093fb 70%,#667eea 100%)', backBg:'#1a1a2e', ink:'#e8eaed', dark:true }, // 3星 金紫→深色底
];

function renderCard(){
  const c=cards[ci];
  if(!c) return;

  /* ---- 主题选择 ---- */
  const theme = CARD_THEMES[Math.min(c.stars, 3)] || CARD_THEMES[0];
  const stage = document.querySelector('.cardstage');
  if(stage){
    stage.style.setProperty('--card-grad', theme.grad);
    stage.style.setProperty('--card-back-bg', theme.backBg);
    stage.style.setProperty('--card-ink', theme.ink);
  }
  const bodyWrap = document.getElementById('cBodyWrap');
  bodyWrap.style.background = theme.backBg;
  bodyWrap.style.color = theme.ink;
  bodyWrap.classList.toggle('dark-theme', !!theme.dark);

  /* ---- 头部：章节标签 + 标题 + 星级 ---- */
  const starsHtml = [1,2,3].map(i =>
    `<span class="gs ${i<=c.stars?'on':''}">★</span>`
  ).join('');
  const pathParts = (c.path||'').split(' › ');
  const chapterTag = pathParts.length > 0 ? pathParts[0] : '考点';

  document.getElementById('cTag').textContent = chapterTag;
  document.getElementById('cTitle').textContent = c.title;  // 纯文本，避免富文本污染标题
  document.getElementById('cStars').innerHTML = starsHtml;

  /* ---- 内容区：直接显示完整 detail（保留所有颜色/加粗/斜体/下划线）---- */
  document.getElementById('cPath').textContent = c.path||'';
  document.getElementById('cChip').textContent = '★ ' + c.stars + ' 星';
  document.getElementById('cBody').innerHTML =
    c.detail || '<em style="color:#9aa6bb">暂无详细内容</em>';

  /* 进度条 */
  const pct = cards.length > 1 ? (ci/(cards.length-1))*100 : 100;
  document.getElementById('cProgFill').style.width = pct + '%';
  document.getElementById('cProg').textContent = `${ci+1} / ${cards.length}`;

  /* 切换动画：轻微弹一下 */
  const card = document.getElementById('theCard');
  card.style.transform = 'scale(.96)';
  requestAnimationFrame(()=>{ card.style.transform = 'scale(1)'; });
}
/* 剥离 HTML 标签取纯文本 */
function stripHtml(s){
  if(!s) return '';
  const d=document.createElement('div'); d.innerHTML=s; return (d.textContent||'').trim();
}
function escHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function cardNext(){ if(ci<cards.length-1){ ci++; renderCard(); } }
function cardPrev(){ if(ci>0){ ci--; renderCard(); } }
document.addEventListener('keydown', e=>{
  const cv=document.getElementById('cardView');
  if(cv.classList.contains('on')){
    if(e.key==='ArrowLeft') cardPrev();
    if(e.key==='ArrowRight') cardNext();
    if(e.key===' ') { e.preventDefault(); cardNext(); }
    if(e.key==='Escape') toggleCards();
  }
});
let _tsx=0;
document.getElementById('cardView').addEventListener('touchstart', e=>{ _tsx=e.touches[0].clientX; }, {passive:true});
document.getElementById('cardView').addEventListener('touchend', e=>{
  const dx=_tsx - e.changedTouches[0].clientX;
  if(dx>60) cardPrev(); else if(dx<-60) cardNext();
}, {passive:true});

/* ---------- 启动：先渲染内置快照，再拉最新发布版 ---------- */
if (IS_READER) {
  editMode = false;
  document.body.classList.add('preview');
  const mb = document.getElementById('modeBtn'); if (mb) mb.style.display='none';
  document.querySelectorAll('[data-edit]').forEach(b=>b.remove());
  const h = document.getElementById('hint');
  if (h) h.textContent = '只读模式 · 可展开折叠 / 同步最新 · 作者分享给学习者的版本';
}
data = deepCopy(EMBEDDED); data.rev = EMBEDDED.rev;
render();
loadSBConf();                 // 读取作者已保存的 Supabase 发布配置
syncNow(); startPolling();
if (!IS_READER && window.matchMedia && window.matchMedia('(max-width:560px)').matches) {
  readingMode = true;
  document.body.classList.add('reading');
}
</script>
